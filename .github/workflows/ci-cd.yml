name: CI and Docker release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  container:
    name: Build and smoke-test Docker image
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag modelkiln:ci .

      - name: Run container
        run: docker run --detach --name modelkiln-ci --publish 127.0.0.1:3210:3210 modelkiln:ci

      - name: Smoke-test health API and dashboard
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3210/api/health; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3210/api/health | grep -q '"ok":true'
          curl --fail --silent http://127.0.0.1:3210/ | grep -q 'ModelKiln'

      - name: Collect container logs and clean up
        if: always()
        run: |
          docker logs modelkiln-ci || true
          docker rm --force modelkiln-ci || true

  publish:
    name: Publish image to GHCR
    needs: container
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}